<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hora e Temperatura - Brasil</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background: rgba(255, 255, 255, 0.95);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            text-align: center;
            min-width: 350px;
        }

        h1 {
            color: #333;
            margin-bottom: 30px;
            font-size: 24px;
        }

        .relogio {
            font-size: 48px;
            font-weight: bold;
            color: #667eea;
            margin: 20px 0;
            font-family: 'Courier New', monospace;
        }

        .data {
            font-size: 18px;
            color: #666;
            margin-bottom: 30px;
        }

        .temperatura {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            padding: 20px;
            border-radius: 15px;
            margin-top: 20px;
        }

        .temp-valor {
            font-size: 42px;
            font-weight: bold;
            color: white;
            margin: 10px 0;
        }

        .cidade {
            font-size: 20px;
            color: white;
            margin-bottom: 10px;
        }

        .descricao {
            font-size: 16px;
            color: rgba(255, 255, 255, 0.9);
            text-transform: capitalize;
        }

        .loading {
            color: #666;
            font-style: italic;
        }

        .erro {
            color: #f5576c;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🇧🇷 Hora e Temperatura do Brasil</h1>
        
        <div class="relogio" id="relogio">--:--:--</div>
        <div class="data" id="data">--/--/----</div>
        
        <div class="temperatura">
            <div class="cidade" id="cidade">
                <span class="loading">Carregando localização...</span>
            </div>
            <div class="temp-valor" id="temperatura">--°C</div>
            <div class="descricao" id="descricao">--</div>
        </div>
    </div>

    <script>
        // Função para atualizar o relógio
        function atualizarRelogio() {
            const agora = new Date();
            
            const horas = String(agora.getHours()).padStart(2, '0');
            const minutos = String(agora.getMinutes()).padStart(2, '0');
            const segundos = String(agora.getSeconds()).padStart(2, '0');
            
            document.getElementById('relogio').textContent = 
                `${horas}:${minutos}:${segundos}`;
            
            const dias = ['Domingo', 'Segunda', 'Terça', 'Quarta', 'Quinta', 'Sexta', 'Sábado'];
            const meses = ['Jan', 'Fev', 'Mar', 'Abr', 'Mai', 'Jun', 'Jul', 'Ago', 'Set', 'Out', 'Nov', 'Dez'];
            
            const diaSemana = dias[agora.getDay()];
            const dia = String(agora.getDate()).padStart(2, '0');
            const mes = meses[agora.getMonth()];
            const ano = agora.getFullYear();
            
            document.getElementById('data').textContent = 
                `${diaSemana}, ${dia} de ${mes} de ${ano}`;
        }

        // Função para buscar temperatura
        async function buscarTemperatura() {
            try {
                // Usando API gratuita OpenWeatherMap
                // Substitua 'SUA_API_KEY' por uma chave real de https://openweathermap.org/api
                const apiKey = 'SUA_API_KEY';
                
                // Alternativa: usar uma cidade padrão (São Paulo)
                const cidade = 'São Paulo';
                const url = `https://api.openweathermap.org/data/2.5/weather?q=${cidade},BR&appid=${apiKey}&units=metric&lang=pt_br`;
                
                const resposta = await fetch(url);
                const dados = await resposta.json();
                
                if (dados.cod === 200) {
                    document.getElementById('cidade').textContent = dados.name;
                    document.getElementById('temperatura').textContent = 
                        `${Math.round(dados.main.temp)}°C`;
                    document.getElementById('descricao').textContent = 
                        dados.weather[0].description;
                } else {
                    throw new Error('Erro ao buscar dados');
                }
            } catch (erro) {
                // Fallback: mostrar dados fictícios se não tiver API key
                document.getElementById('cidade').textContent = 'São Paulo';
                document.getElementById('temperatura').textContent = '25°C';
                document.getElementById('descricao').textContent = 
                    'Configure a API key para dados reais';
            }
        }

        // Iniciar relógio
        atualizarRelogio();
        setInterval(atualizarRelogio, 1000);

        // Buscar temperatura ao carregar
        buscarTemperatura();
        // Atualizar temperatura a cada 10 minutos
        setInterval(buscarTemperatura, 600000);
    </script>
</body>
</html>

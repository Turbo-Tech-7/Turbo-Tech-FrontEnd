services:
  alb_01_01251142:
    image: nginx:alpine
    container_name: alb_01_01251142
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app_01_01251142
      - app_02_01251142
      - app_03_01251142
    restart: unless-stopped
    networks:
      - rede_01251142

  app_01_01251142:
    image: turbotech
    container_name: app_01_01251142
    ports:
      - "8081:80"
    depends_on:
      - db_01_01251142
    restart: unless-stopped
    networks:
      - rede_01251142

  app_02_01251142:
    image: turbotech
    container_name: app_02_01251142
    ports:
      - "8082:80"
    depends_on:
      - db_01_01251142
    restart: unless-stopped
    networks:
      - rede_01251142

  app_03_01251142:
    image: turbotech
    container_name: app_03_01251142
    ports:
      - "8083:80"
    depends_on:
      - db_01_01251142
    restart: unless-stopped
    networks:
      - rede_01251142

  db_01_01251142:
    image: mysql:8.0
    container_name: db_01_01251142
    environment:
      MYSQL_ROOT_PASSWORD: urubu100
      MYSQL_DATABASE: turbotech
      MYSQL_USER: appuser
      MYSQL_PASSWORD: apppass
    volumes:
      - db_data_01251142:/var/lib/mysql
    restart: unless-stopped
    networks:
      - rede_01251142

volumes:
  db_data_01251142:

networks:
  rede_01251142:
    driver: bridge